
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My GitHub Website</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f0f4f8;
            text-align: center;
            padding: 50px;
        }

        h1 {
            color: #2563eb;
        }

        p {
            font-size: 18px;
            color: #333;
        }

        button {
            background-color: #2563eb;
            color: white;
            padding: 12px 24px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
        }

        button:hover {
            background-color: #1d4ed8;
        }
    </style>
</head>
<body>

    <h1>Welcome to My Website!</h1>

    <p>This website is hosted using GitHub Pages.</p>

    <button onclick="alert('Hello! Welcome to my website.')">
        Click Me
    </button>

</body>
</html>
